<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Diyet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diyet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Monokrom zemin, yumuşak kartlar, tek turuncu vurgu. Renk yalnızca
   "şimdi" olanı ve üç halkayı (kalori, protein, su) taşır. */
:root {
  color-scheme: light dark;
  --bg: #f1f1f3; --page: #f1f1f3; --fg: #0b0b0c; --muted: #6e6e73; --faint: #b4b4ba;
  --card: #ffffff; --card-line: transparent; --card-shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 12px 28px -16px rgb(0 0 0 / 12%);
  --ctl: #f1f1f3; --track: #e7e7ec;
  --accent: #ff6a1a; --on-accent: #ffffff; --blue: #3b82f6; --danger: #e5252a;
  --glass: rgb(255 255 255 / 72%); --glass-line: rgb(0 0 0 / 6%);
  --sheet: #ffffff; --sheet-fill: #f1f1f3;
  --float: 0 18px 50px -12px rgb(0 0 0 / 28%), 0 2px 8px rgb(0 0 0 / 8%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b; --page: radial-gradient(120% 50% at 50% -8%, #202026 0%, #09090b 62%); --fg: #f5f5f7; --muted: #8e8e96; --faint: #55555c;
    --card: linear-gradient(180deg, #1c1c20 0%, #141417 100%); --card-line: rgb(255 255 255 / 7%); --card-shadow: none;
    --ctl: rgb(255 255 255 / 7%); --track: rgb(255 255 255 / 9%);
    --accent: #ff7a2f; --on-accent: #1a0d04; --blue: #5b9dff; --danger: #ff5a52;
    --glass: rgb(34 34 38 / 72%); --glass-line: rgb(255 255 255 / 10%);
    --sheet: #18181b; --sheet-fill: rgb(255 255 255 / 7%);
    --float: 0 18px 50px -12px rgb(0 0 0 / 80%);
  }
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--page) fixed; color: var(--fg); min-height: 100vh;
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }
main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px); }
h1 { font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 15px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 6px 18px; }
.link { color: var(--fg); font-size: 15px; font-weight: 600; padding: 6px 0; }
.link.quiet { color: var(--muted); font-weight: 400; }
.pill { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--ctl); color: var(--muted); white-space: nowrap; }
.pill.hot { background: var(--accent); color: var(--on-accent); }
.pill.late { background: none; color: var(--danger); padding-right: 0; }

/* Hafta şeridi: her gün, uyumu halka olarak taşıyan bir daire */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 18px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; }
.day small { font-size: 12px; color: var(--muted); }
.day.today small { color: var(--accent); font-weight: 600; }
.day .disc { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--fg) calc(var(--p) * 1%), var(--track) 0); transition: transform .15s; }
.day .disc b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 15px; font-weight: 600; }
.day.sel .disc b { background: var(--fg); color: var(--bg); }
.day.today:not(.sel) .disc b { color: var(--accent); }
.day.today.sel .disc { background: var(--accent); } .day.today.sel .disc b { background: var(--accent); color: var(--on-accent); }
.day:active .disc { transform: scale(.92); }

/* Kartlar */
.card, .hero, .stat { background: var(--card); border-radius: 26px; box-shadow: var(--card-shadow), inset 0 0 0 1px var(--card-line); }
.card { padding: 8px 18px; margin-bottom: 12px; }
.card > header { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.card > header .ttl { flex: 1; min-width: 0; }
.card > header h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.card > header .sub { font-size: 13px; display: block; margin-top: 1px; }
.card > header .sub.late { color: var(--danger); }
.ico { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--ctl); display: grid; place-items: center; }
.ico svg { width: 21px; height: 21px; fill: none; stroke: var(--fg); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.card.now .ico { background: var(--accent); } .card.now .ico svg { stroke: var(--on-accent); }
.card.folded { padding-top: 4px; padding-bottom: 4px; }
.card.folded .ico { background: var(--fg); } .card.folded .ico svg { stroke: var(--bg); stroke-width: 2.4; width: 16px; height: 16px; }
.card.folded.skipped .ico { background: var(--ctl); } .card.folded.skipped .ico svg { stroke: var(--faint); }
.card.folded h2 { color: var(--muted); font-weight: 600; }
.sect { font-size: 13px; font-weight: 600; color: var(--muted); padding: 18px 6px 8px; text-transform: uppercase; letter-spacing: .04em; }

/* Öne çıkan kart */
.hero { padding: 20px 20px 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.hero .big { font-size: 46px; font-weight: 700; line-height: 1.02; letter-spacing: -.03em; }
.hero .big small { font-size: 20px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
.hero .what { color: var(--muted); font-size: 15px; margin-top: 8px; position: relative; z-index: 1; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; position: relative; z-index: 1; }
.tile { background: var(--ctl); border-radius: 18px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.tile strong { font-size: 21px; font-weight: 700; letter-spacing: -.02em; display: block; line-height: 1.1; margin: 4px 0 1px; }
.tile span { display: block; white-space: nowrap; }
.tile span { font-size: 12px; color: var(--muted); }
.ring { width: 44px; height: 44px; transform: rotate(-90deg); align-self: flex-end; margin-top: -2px; }
.ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring .t { stroke: var(--track); } .ring .p { stroke: var(--c, var(--fg)); transition: stroke-dashoffset .4s ease; }

/* Satırlar */
.row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0 11px 6px; }
.row .body { flex: 1; min-width: 0; padding-top: 2px; }
.row .name { display: block; }
.row .meta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.row.skip .name { color: var(--muted); text-decoration: line-through; }
.chk { width: 28px; height: 28px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--faint); display: grid; place-items: center; transition: background .15s, transform .15s, box-shadow .15s; }
.chk svg { width: 14px; height: 14px; stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.row.done .chk, .row.swap .chk { background: var(--fg); box-shadow: none; }
.row.done .chk svg, .row.swap .chk svg { opacity: 1; }
.row.skip .chk { box-shadow: inset 0 0 0 2px var(--track); } .row.skip .chk svg { opacity: 1; stroke: var(--faint); }
.row.plus .chk { box-shadow: inset 0 0 0 2px var(--accent); }
.row.plus .meta { color: var(--accent); }
.row:active .chk { transform: scale(.86); }
.more { width: 36px; height: 32px; flex: none; display: grid; place-items: center; color: var(--faint); margin-right: -8px; }
.more svg { width: 20px; height: 20px; fill: currentColor; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 14px; padding: 7px 13px; border-radius: 999px; background: var(--ctl); color: var(--fg); white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.chip em { font-style: normal; color: var(--muted); margin-left: 5px; font-size: 12px; }
.chip.on em { color: inherit; opacity: .55; }
.chip.full:not(.on) { color: var(--faint); }
.pick { padding: 2px 0 6px 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ctl); border-radius: 14px; padding: 3px; margin: 2px 0 6px; }
.seg button { font-size: 14px; text-align: center; padding: 8px 4px; border-radius: 11px; color: var(--muted); }
.seg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.acts { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; padding: 10px 0 10px; }
.acts button { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 13px 6px; border-radius: 16px; background: var(--ctl); }
.acts button:first-child { background: var(--fg); color: var(--bg); }
.card.now .acts button:first-child { background: var(--accent); color: var(--on-accent); }
.acts button:active { transform: scale(.97); }
.acts svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Sayaçlar */
.counter { display: flex; align-items: center; gap: 12px; padding: 12px 0 12px 6px; }
.counter .body { flex: 1; }
.counter .val { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.counter .val.over { color: var(--danger); }
.step { width: 40px; height: 40px; border-radius: 50%; background: var(--ctl); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.step:last-child { background: var(--fg); color: var(--bg); }
.step:active { transform: scale(.9); }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 9px; display: block; }
.bar u { display: block; height: 100%; background: var(--c, var(--fg)); border-radius: 3px; transition: width .25s ease; }

/* Hafta */
.wrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; }
.wrow .d { width: 150px; flex: none; } .wrow .d small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .bar { flex: 1; margin: 0; }
.wrow .pct { width: 44px; text-align: right; color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat { padding: 16px 18px; }
.stat strong { font-size: 30px; font-weight: 700; letter-spacing: -.03em; display: block; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; }
.kv span:last-child { color: var(--muted); text-align: right; }
.field { display: flex; gap: 8px; padding: 8px 0 12px; }
.field input { flex: 1; min-width: 0; background: var(--ctl); border: 0; border-radius: 14px; padding: 12px 14px; outline: none; -webkit-user-select: text; user-select: text; }
.btn { background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 18px; font-weight: 600; text-align: center; }
.spark { width: 100%; height: 64px; display: block; margin: 4px 0 8px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.prose p { padding: 9px 0; font-size: 16px; }
.prose p small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.note { font-size: 13px; color: var(--muted); padding: 0 6px 12px; }

/* Yüzen sekme çubuğu */
nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 5;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  box-shadow: var(--float), inset 0 0 0 1px var(--glass-line);
}
nav button { height: 50px; min-width: 50px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
nav button span { display: none; }
nav button.on { background: var(--fg); color: var(--bg); padding: 0 18px 0 14px; } nav button.on span { display: inline; }
nav button.cam { background: var(--accent); color: var(--on-accent); padding: 0; width: 50px; }
nav button:active { transform: scale(.94); }
nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Alt sayfa */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 45%); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86vh; overflow-y: auto; max-width: 560px; margin: 0 auto;
  background: var(--sheet); border-radius: 30px 30px 0 0; box-shadow: var(--float);
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .6; margin: 0 auto 16px; }
.sheet h3 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; padding: 0 6px; }
.sheet .sub { padding: 4px 6px 16px; }
.group { background: var(--sheet-fill); border-radius: 20px; padding: 2px 16px; margin-bottom: 12px; }
.group button { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 0; }
.group button.accent { color: var(--muted); }
.group .field { padding: 10px 0; } .group .field input { background: var(--sheet); }
.sheet textarea { width: 100%; min-height: 104px; background: var(--sheet-fill); border: 0; border-radius: 20px; padding: 14px 16px; font: inherit; color: inherit; outline: none; resize: none; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }
.sheet .btn { display: block; width: 100%; padding: 15px; border-radius: 18px; margin-bottom: 4px; background: var(--accent); color: var(--on-accent); }
.sheet .group .btn { width: auto; padding: 12px 18px; border-radius: 14px; margin: 0; background: var(--fg); color: var(--bg); }
.sheet .cancel { display: block; width: 100%; text-align: center; padding: 13px; color: var(--muted); font-weight: 600; }
.res { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; }
.res small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.res > span:last-child { color: var(--muted); font-size: 15px; flex: none; }
.busy { text-align: center; padding: 28px 0 36px; color: var(--muted); }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--accent); margin: 0 auto 14px; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.err { color: var(--danger); font-size: 15px; padding: 0 6px 12px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="scrim" data-act="close"></div>
<div class="sheet" id="sheet"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<script src="app.js"></script>
</body>
</html>
