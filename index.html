<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Diyet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diyet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Studio'nun dili: iki yüzey (zemin + tek gri dolgu), çizgi yok, tek vurgu
   rengi yalnızca tıklanabilir olan için, kırmızı yalnızca geciken için. */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1d1d1f; --fill: #f5f5f7; --on-fill: #ffffff;
  --muted: #6e6e73; --faint: #aeaeb2; --accent: #0071e3; --danger: #d70015;
  --bar: rgb(255 255 255 / 80%);
  --float: 0 10px 40px -8px rgb(0 0 0 / 18%), 0 2px 8px rgb(0 0 0 / 6%);
  --r: 12px; --sheet: #ffffff; --sheet-fill: #f5f5f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --fg: #f5f5f7; --fill: #1c1c1e; --on-fill: #000000;
    --muted: #98989d; --faint: #636366; --accent: #2997ff; --danger: #ff453a;
    --bar: rgb(0 0 0 / 75%); --sheet: #1c1c1e; --sheet-fill: #2c2c2e;
    --float: 0 10px 40px -8px rgb(0 0 0 / 60%);
  }
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }
main {
  max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px);
}
h1 { font-size: 34px; font-weight: 700; line-height: 1.1; }
.sub { color: var(--muted); font-size: 15px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 4px 16px; }
.link { color: var(--accent); font-size: 15px; padding: 6px 0; }
.link.quiet { color: var(--muted); }
.mini { width: 48px; height: 48px; position: relative; flex: none; }
.mini svg { width: 48px; height: 48px; transform: rotate(-90deg); }
.mini circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.mini .t { stroke: var(--fill); } .mini .p { stroke: var(--fg); transition: stroke-dashoffset .35s ease; }
.mini b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.next { display: flex; justify-content: space-between; gap: 12px; padding: 0 4px 14px; font-size: 15px; color: var(--muted); }
.next b { color: var(--fg); font-weight: 600; }
.next .late { color: var(--danger); }
.acts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; padding: 8px 0 10px; }
.acts button { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 11px 6px; border-radius: 12px; background: var(--on-fill); color: var(--accent); }
.acts button:active { opacity: .6; }
.card.now .acts button:first-child { background: var(--accent); color: #fff; }
.acts svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.why { font-size: 13px; color: var(--muted); padding: 2px 0 10px; }
.sheet textarea { width: 100%; min-height: 96px; background: var(--sheet-fill); border: 0; border-radius: 14px; padding: 12px 14px; font: inherit; color: inherit; outline: none; resize: none; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }
.sheet .btn { display: block; width: 100%; padding: 13px; border-radius: 14px; margin-bottom: 4px; }
.sheet .cancel { display: block; width: 100%; text-align: center; padding: 12px; color: var(--accent); }
.res { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; }
.res small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.res > span:last-child { color: var(--muted); font-size: 15px; flex: none; }
.busy { text-align: center; padding: 28px 0 36px; color: var(--muted); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--sheet-fill); border-top-color: var(--fg); margin: 0 auto 14px; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.err { color: var(--danger); font-size: 15px; padding: 0 4px 12px; }

/* Hafta şeridi */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; border-radius: var(--r); }
.day small { font-size: 12px; color: var(--muted); }
.day b { font-size: 17px; font-weight: 600; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.day.sel b { background: var(--fg); color: var(--bg); }
.day.today:not(.sel) b { color: var(--accent); }
.day i { width: 22px; height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; display: block; }
.day i u { display: block; height: 100%; background: var(--fg); }

/* Özet */
.summary-old { display: flex; align-items: center; gap: 16px; background: var(--fill); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.ring { width: 64px; height: 64px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .t { stroke: var(--on-fill); } .ring .p { stroke: var(--fg); transition: stroke-dashoffset .35s ease; }
.summary-old strong { font-size: 22px; font-weight: 700; display: block; }

/* Kartlar */
.card { background: var(--fill); border-radius: 18px; padding: 6px 16px; margin-bottom: 12px; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; }
.card > header h2 { font-size: 20px; font-weight: 700; flex: 1; display: flex; align-items: baseline; gap: 8px; }
.card > header h2 span { font-size: 15px; font-weight: 400; color: var(--muted); }
.card > header h2 span.late { color: var(--danger); }
.card > header .link { padding: 6px 0 6px 10px; }
.card.folded > header { padding-bottom: 10px; }
.sect { font-size: 13px; color: var(--muted); padding: 18px 4px 8px; }

.row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; }
.row .body { flex: 1; min-width: 0; padding-top: 2px; }
.row .name { display: block; }
.row .meta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.row.skip .name { color: var(--muted); text-decoration: line-through; }
.chk { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--on-fill); display: grid; place-items: center; transition: background .15s, transform .15s; }
.chk svg { width: 14px; height: 14px; stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.row.done .chk, .row.swap .chk { background: var(--fg); }
.row.done .chk svg, .row.swap .chk svg { opacity: 1; }
.row.skip .chk svg { opacity: 1; stroke: var(--faint); }
.row:active .chk { transform: scale(.88); }
.more { width: 36px; height: 32px; flex: none; display: grid; place-items: center; color: var(--faint); margin-right: -8px; }
.more svg { width: 20px; height: 20px; fill: currentColor; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--on-fill); color: var(--fg); white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--bg); }
.chip em { font-style: normal; color: var(--muted); margin-left: 4px; }
.chip.on em { color: inherit; opacity: .6; }
.chip.full:not(.on) { color: var(--faint); }
.pick { padding: 6px 0 4px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--on-fill); border-radius: 10px; padding: 2px; margin: 4px 0 6px; }
.seg button { font-size: 14px; text-align: center; padding: 7px 4px; border-radius: 8px; }
.seg button.on { background: var(--fill); font-weight: 600; }

/* Sayaçlar */
.counter { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.counter .body { flex: 1; }
.counter .val { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.counter .val.over { color: var(--danger); }
.step { width: 36px; height: 36px; border-radius: 50%; background: var(--on-fill); display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--accent); }
.step:active { transform: scale(.9); }
.bar { height: 4px; border-radius: 2px; background: var(--on-fill); overflow: hidden; margin-top: 8px; }
.bar u { display: block; height: 100%; background: var(--fg); border-radius: 2px; transition: width .25s ease; }

/* Hafta */
.wrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; }
.wrow .d { width: 150px; flex: none; } .wrow .d small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .bar { flex: 1; margin: 0; height: 6px; border-radius: 3px; }
.wrow .pct { width: 44px; text-align: right; color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat { background: var(--fill); border-radius: 18px; padding: 14px 16px; }
.stat strong { font-size: 24px; font-weight: 700; display: block; }
.stat span { font-size: 13px; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; }
.kv span:last-child { color: var(--muted); text-align: right; }
.field { display: flex; gap: 8px; padding: 8px 0 12px; }
.field input { flex: 1; min-width: 0; background: var(--on-fill); border: 0; border-radius: 10px; padding: 10px 12px; outline: none; -webkit-user-select: text; user-select: text; }
.btn { background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; text-align: center; }
.spark { width: 100%; height: 64px; display: block; margin: 4px 0 8px; }
.spark polyline { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--fg); }

.prose p { padding: 9px 0; font-size: 16px; }
.prose p small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.note { font-size: 13px; color: var(--muted); padding: 0 4px 12px; }

/* Sekme çubuğu */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 8px 12px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 0; }
nav button.on { color: var(--accent); }
nav svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Alt sayfa */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 35%); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86vh; overflow-y: auto;
  max-width: 560px; margin: 0 auto;
  background: var(--sheet); border-radius: 22px 22px 0 0; box-shadow: var(--float);
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
}
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .5; margin: 0 auto 14px; }
.sheet h3 { font-size: 20px; font-weight: 700; padding: 0 4px; }
.sheet .sub { padding: 2px 4px 14px; }
.group { background: var(--sheet-fill); border-radius: 14px; padding: 0 16px; margin-bottom: 12px; }
.group button { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 0; }
.group button.accent { color: var(--accent); }
.group .field { padding: 10px 0; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="scrim" data-act="close"></div>
<div class="sheet" id="sheet"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<script src="app.js"></script>
</body>
</html>
