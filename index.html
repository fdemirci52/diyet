<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Diyet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diyet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<script>
/* Seçilen tema ilk boyamadan önce uygulanır. */
window.applyTheme = function () {
  var v = ''; try { v = localStorage.getItem('diyet-theme') || ''; } catch (e) {}
  var r = document.documentElement, m = document.querySelectorAll('meta[name="theme-color"]');
  if (v) r.setAttribute('data-theme', v); else r.removeAttribute('data-theme');
  m[0].content = v === 'dark' ? '#0a0a0b' : '#f2f2f4'; m[1].content = v === 'light' ? '#f2f2f4' : '#0a0a0b';
};
window.applyTheme();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Ölçü: 4'ün katları. Köşe: kart 24, panel 22, kontrol 16, hap 999.
   Yazı: 34 başlık · 22 vurgu · 17 gövde · 15 ikincil · 13 açıklama · 11 etiket.
   Renk: siyah-beyaz zemin; turuncu yalnızca "şimdi", mavi yalnızca su. */
:root {
  color-scheme: light dark;
  --bg: #f2f2f4; --page: #f2f2f4; --fg: #0b0b0c; --muted: #6f6f76; --faint: #b9b9c0;
  --card: #ffffff; --line: transparent; --shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 10px 26px -18px rgb(0 0 0 / 18%);
  --ctl: #f0f0f3; --track: #e6e6eb;
  --accent: #ff6a1a; --on-accent: #ffffff; --blue: #3b82f6; --danger: #e5252a;
  --glass: rgb(255 255 255 / 78%); --glass-line: rgb(0 0 0 / 7%);
  --sheet: #ffffff; --sheet-fill: #f2f2f4;
  --float: 0 16px 40px -14px rgb(0 0 0 / 30%), 0 2px 6px rgb(0 0 0 / 6%);
  --lift: 0 2px 4px rgb(0 0 0 / 4%), 0 18px 40px -22px rgb(0 0 0 / 28%);
}
/* Koyu tema: sistem koyuyken (kullanıcı açık seçmediyse) ya da kullanıcı koyu seçtiyse. İki blok aynı kalmalı. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0b; --page: radial-gradient(120% 46% at 50% -6%, #1e1e23 0%, #0a0a0b 64%); --fg: #f5f5f7; --muted: #8f8f97; --faint: #4e4e55;
    --card: #161618; --line: rgb(255 255 255 / 6%); --shadow: none;
    --ctl: rgb(255 255 255 / 7%); --track: rgb(255 255 255 / 10%);
    --accent: #ff7a2f; --on-accent: #1c0e04; --blue: #5b9dff; --danger: #ff5a52;
    --glass: rgb(30 30 33 / 78%); --glass-line: rgb(255 255 255 / 9%);
    --sheet: #18181b; --sheet-fill: rgb(255 255 255 / 6%);
    --float: 0 16px 40px -12px rgb(0 0 0 / 85%);
    --lift: 0 18px 40px -16px rgb(0 0 0 / 80%);
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0a0b; --page: radial-gradient(120% 46% at 50% -6%, #1e1e23 0%, #0a0a0b 64%); --fg: #f5f5f7; --muted: #8f8f97; --faint: #4e4e55;
    --card: #161618; --line: rgb(255 255 255 / 6%); --shadow: none;
    --ctl: rgb(255 255 255 / 7%); --track: rgb(255 255 255 / 10%);
    --accent: #ff7a2f; --on-accent: #1c0e04; --blue: #5b9dff; --danger: #ff5a52;
    --glass: rgb(30 30 33 / 78%); --glass-line: rgb(255 255 255 / 9%);
    --sheet: #18181b; --sheet-fill: rgb(255 255 255 / 6%);
    --float: 0 16px 40px -12px rgb(0 0 0 / 85%);
    --lift: 0 18px 40px -16px rgb(0 0 0 / 80%);
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--page) fixed; color: var(--fg); min-height: 100vh;
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; overscroll-behavior-y: none;
}
/* İçerik sekme çubuğunun altında dağınık görünmesin: alttan zemine erir. */
body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom) + 116px); background: linear-gradient(to top, var(--bg) 30%, transparent); pointer-events: none; z-index: 4; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 124px); }

/* Başlık */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 20px; min-height: 76px; }
.head p { color: var(--muted); font-size: 15px; margin-bottom: 2px; }
h1 { font-size: 34px; font-weight: 700; line-height: 1.08; letter-spacing: -.022em; }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--ctl); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.hot { background: var(--accent); color: var(--on-accent); }
.pill.late { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.round { width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.round:disabled { opacity: .35; }
.round:active, .pill:active { transform: scale(.94); }
.dayring { position: relative; width: 54px; height: 54px; flex: none; }
.dayring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.ring { display: block; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-linecap: round; }
.ring .t { stroke: var(--track); } .ring .p { stroke: var(--c, var(--fg)); transition: stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1); }

/* Hafta şeridi */
/* Gün kaydırma: başlığı sola ya da sağa kaydırınca yalnızca o anda bir kez oynar. */
.slide-l { animation: slidel .26s cubic-bezier(.2,.8,.2,1); } .slide-r { animation: slider .26s cubic-bezier(.2,.8,.2,1); }
@keyframes slidel { from { opacity: .3; transform: translateX(28px); } } @keyframes slider { from { opacity: .3; transform: translateX(-28px); } }
@media (prefers-reduced-motion: reduce) { .slide-l, .slide-r { animation: none; } }
.head { touch-action: pan-y; }

/* Kart ve ölçüm kutuları */
.card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 6px 18px; margin-bottom: 12px; }
.card.pad { padding: 18px; }
.blank { padding: 32px 20px 20px; text-align: center; }
.blank .bic { width: 56px; height: 56px; border-radius: 999px; background: var(--ctl); display: grid; place-items: center; margin: 0 auto 16px; }
.blank .bic svg { width: 26px; height: 26px; }
.blank h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.blank p { color: var(--muted); font-size: 15px; line-height: 1.4; margin: 8px 4px 24px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); }
.sect { font-size: 15px; font-weight: 600; padding: 16px 4px 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.tiles.two { grid-template-columns: repeat(2, 1fr); margin-bottom: 12px; }
.tile { background: var(--card); border-radius: 20px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 14px 14px 13px; min-width: 0; }
.tile .top { display: flex; justify-content: space-between; align-items: center; height: 30px; margin-bottom: 10px; }
.tile strong { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; white-space: nowrap; }
.tile strong em { font-style: normal; font-size: 15px; font-weight: 600; margin-left: 2px; }
.tile small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
/* Kadranlar: sayı halkanın içinde, ad ve hedef hemen altında. */
.dials .tile { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 6px 11px; }
.dials .dr { position: relative; width: 76px; height: 76px; margin-bottom: 7px; }
.dials .dr strong { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; letter-spacing: -.03em; }
.dials .dr strong em { font-size: 12px; margin-left: 1px; }
.dials .tile b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.dials .tile small { margin-top: 1px; font-size: 11px; line-height: 1.25; }
.num { font-size: 44px; font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: 4px; }
.num em { font-style: normal; font-size: 20px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

/* Zaman çizelgesi */
.ev { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 14px; position: relative; padding-bottom: 20px; }
.ev::before { content: ""; position: absolute; left: 21px; top: 49px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--track); }
.ev:last-child::before, .ev.open::before { display: none; }
.ev.open { padding-bottom: 24px; }
.ev.done::before { background: var(--fg); opacity: .28; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); color: var(--fg); transition: background .2s, color .2s; }
.node svg.i { width: 20px; height: 20px; }
.ev.done .node { background: var(--fg); color: var(--bg); box-shadow: none; } .ev.done .node svg.i { stroke-width: 2.6; width: 18px; height: 18px; }
.ev.skipd .node { background: var(--ctl); color: var(--faint); box-shadow: none; }
.ev.now .node { background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
.evh { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; }
.evh > div { flex: 1; min-width: 0; }
.evh h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.evh p { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.evh .t { font-size: 15px; color: var(--muted); flex: none; }
.ev.done .evh h3, .ev.skipd .evh h3 { color: var(--muted); }
.ev.now .evh h3 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.panel { grid-column: 1 / -1; background: var(--card); border-radius: 22px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 6px 18px 18px; margin: 14px 0 0; }
/* Açık öğün: başlığıyla birlikte tek kart. Ayırıcı yok; ilerleme simgenin çevresindeki halkada. */
.ev.open { display: block; }
.mcard { background: var(--card); border-radius: 24px; box-shadow: var(--lift), inset 0 0 0 1px var(--line); padding: 0 16px 16px; }
.mcard .panel { background: none; box-shadow: none; padding: 0; margin: 0; }
.mh { position: sticky; top: env(safe-area-inset-top); z-index: 3; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; width: calc(100% + 32px); margin: 0 -16px; padding: 14px 16px 10px; background: var(--card); border-radius: 24px; transition: box-shadow .2s; }
.mh.stuck { box-shadow: var(--lift); }
.mh .node { position: relative; box-shadow: none; }
.ev:not(.done):not(.now):not(.skipd) .mh .node { background: var(--ctl); }
.mh h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.ev.now .mh h3 { font-size: 22px; }
.nprog { position: absolute; inset: -4px; pointer-events: none; }
.ev.now .nprog .ring .p { stroke: var(--accent); } .ev.now .nprog .ring .t { stroke: color-mix(in srgb, var(--accent) 22%, transparent); }
.ev.now .mh .node { box-shadow: none; }
.cap { font-size: 13px; color: var(--muted); padding: 10px 0 2px; }

/* Satırlar */
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; }
.row .b { flex: 1; min-width: 0; }
.row .n { display: block; font-size: 16px; line-height: 1.3; }
.row .m { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.row.skip .n { color: var(--muted); text-decoration: line-through; }
.row.plus .m { color: var(--accent); }
.row.goto > svg.i { color: var(--faint); width: 20px; height: 20px; }
.rsect { font-size: 13px; color: var(--muted); padding: 16px 0 2px; }
.ev.fresh .panel { animation: rise .3s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(-8px); } }
.chk { width: 26px; height: 26px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--faint); display: grid; place-items: center; color: var(--bg); transition: background .15s, box-shadow .15s, transform .15s; }
.chk svg.i { width: 15px; height: 15px; stroke-width: 3; opacity: 0; }
.row.done .chk, .row.swap .chk { background: var(--fg); box-shadow: none; }
.row.done .chk svg.i, .row.swap .chk svg.i, .row.skip .chk svg.i { opacity: 1; }
.row.skip .chk { box-shadow: inset 0 0 0 2px var(--track); color: var(--faint); }
.row.plus .chk { box-shadow: inset 0 0 0 2px var(--accent); }
.row:active .chk { transform: scale(.84); }
/* Miktar hapı: porsiyon ve muadil sayfasını açar; plandan farklıysa dolu. */
.amt { flex: none; height: 30px; min-width: 30px; padding: 0 11px; border-radius: 999px; background: var(--ctl); font-size: 13px; font-weight: 600; display: grid; place-items: center; white-space: nowrap; margin-right: -4px; }
.amt.on { background: var(--fg); color: var(--bg); }
.amt.dot { padding: 0; width: 30px; color: var(--muted); }
.amt svg.i { width: 18px; height: 18px; }
.amt:active { transform: scale(.92); }
/* Açık öğün: kalemler çizgiyle ayrılır; yenen sönük, bekleyen belirgin. */
.panel .row + .row { box-shadow: none; position: relative; }
.panel .row + .row::before { content: ""; position: absolute; left: 38px; right: 0; top: 0; height: 1px; background: var(--track); }
.panel .row.done .n, .panel .row.swap .n { color: var(--muted); }
.panel .row:not(.done):not(.swap):not(.skip):not(.plus) .chk { box-shadow: inset 0 0 0 2px var(--muted); }
.psum { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; padding: 4px 0 8px; }
.psum small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.psum span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
.psum b { color: var(--fg); font-size: 15px; font-weight: 700; }
.mnote { display: flex; gap: 10px; align-items: flex-start; width: 100%; background: var(--ctl); border-radius: 14px; padding: 10px 12px; margin: 10px 0 4px; font-size: 14px; line-height: 1.35; }
.mnote svg.i { width: 16px; height: 16px; color: var(--muted); margin-top: 1px; }
.tbtns { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
.tbtns button { padding: 4px 6px; font-size: 14px; color: var(--muted); }
.more { width: 36px; height: 36px; flex: none; display: grid; place-items: center; color: var(--faint); margin-right: -8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ctl); border-radius: 14px; padding: 3px; margin: 10px 0 4px; }
.seg button { font-size: 14px; font-weight: 500; text-align: center; height: 34px; border-radius: 11px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / 12%); }
/* Öğün başına tek ana düğme; fotoğraf ve yazı yanında iki kare düğme. */
.actions { display: grid; grid-template-columns: minmax(0, 1fr) 54px 54px; gap: 8px; margin-top: 10px; }
.primary { height: 54px; border-radius: 17px; background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.primary svg.i { stroke-width: 2.4; width: 20px; height: 20px; }
.ev.now .primary, .sheet .primary { background: var(--accent); color: var(--on-accent); }
.primary.is-done { background: var(--ctl); color: var(--fg); }
.sq { height: 54px; border-radius: 17px; background: var(--ctl); display: grid; place-items: center; }
.primary:active, .sq:active { transform: scale(.97); }
.textbtn { display: block; margin: 12px auto 0; padding: 4px 10px; font-size: 14px; color: var(--muted); }

/* Sayaç */
.stepper { display: flex; align-items: center; background: var(--ctl); border-radius: 999px; padding: 3px; flex: none; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.stepper button:last-child { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / 14%); }
.stepper button:active { transform: scale(.88); }
.stepper b { min-width: 30px; text-align: center; font-size: 16px; font-weight: 600; }
.over { color: var(--danger); }

/* Hafta */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 132px; margin-top: 18px; }
.barcol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.barcol span { flex: 1; width: 100%; max-width: 30px; border-radius: 9px; background: var(--ctl); display: flex; align-items: flex-end; overflow: hidden; }
.barcol u { display: block; width: 100%; background: var(--fg); border-radius: 9px; min-height: 0; transition: height .4s cubic-bezier(.2,.8,.2,1); }
.barcol.today u { background: var(--accent); }
.barcol small { font-size: 12px; font-weight: 500; color: var(--muted); }
.barcol.today small { color: var(--accent); font-weight: 700; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--faint); }
.dots i.on { background: var(--fg); box-shadow: none; }
.menu { display: grid; grid-template-columns: 58px 1fr 1fr; align-items: center; width: 100%; min-height: 44px; padding: 0 10px; border-radius: 12px; font-size: 15px; }
.menu.h { min-height: 30px; font-size: 12px; font-weight: 600; color: var(--muted); }
.menu b { font-weight: 600; }
.menu.today { background: var(--ctl); } .menu.today b { color: var(--accent); }
.menu.past { color: var(--muted); }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 48px; padding: 6px 0; font-size: 16px; }
.kv > :last-child { color: var(--muted); text-align: right; }
.field { display: flex; gap: 8px; padding: 10px 0 12px; }
.field input { flex: 1; min-width: 0; height: 48px; background: var(--ctl); border: 0; border-radius: 14px; padding: 0 14px; outline: none; -webkit-user-select: text; user-select: text; }
.btn { height: 48px; padding: 0 18px; border-radius: 14px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 16px; }
.spark { width: 100%; height: 56px; display: block; margin: 10px 0 2px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.note { font-size: 13px; color: var(--muted); padding: 2px 4px 14px; line-height: 1.4; }

/* Program: liste */
.nav-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 8px 0; }
.nav-row .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--ctl); display: grid; place-items: center; flex: none; }
.nav-row .ic svg.i { width: 20px; height: 20px; }
.nav-row .b { flex: 1; min-width: 0; }
.nav-row .n { display: block; font-size: 16px; font-weight: 500; }
.nav-row .m { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.nav-row > svg.i { color: var(--faint); width: 18px; height: 18px; }
.prose p { padding: 10px 0; font-size: 16px; line-height: 1.35; }
.prose p small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }

/* Sekme çubuğu: sabit ölçülü dört sekme */
.dock { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 5; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
.dock > * { pointer-events: auto; -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: var(--float), inset 0 0 0 1px var(--glass-line); }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 68px)); max-width: calc(100vw - 20px); gap: 2px; padding: 5px; border-radius: 26px; background: var(--glass); }
.tabs button { height: 54px; border-radius: 21px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; transition: background .2s, color .2s; }
.tabs button svg.i { width: 23px; height: 23px; }
.tabs button.on { color: var(--fg); background: var(--ctl); }
.tabs button:active { transform: scale(.94); }

/* Alt sayfa */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 48%); opacity: 0; pointer-events: none; transition: opacity .22s; }
/* Her sayfa tam boy: üstte boşluk kalır, içerik sığmazsa sayfanın içinde kayar. */
.sheet { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 48px); bottom: 0; z-index: 11; overflow-y: auto; overscroll-behavior: contain; max-width: 520px; margin: 0 auto; background: var(--sheet); border-radius: 30px 30px 0 0; box-shadow: var(--float); padding: 0 16px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; }
/* Tutamaç: geniş dokunma alanı, kaydırınca üstte kalır; dokununca ya da aşağı çekince sayfa kapanır. */
.grab { display: block; position: sticky; top: 0; z-index: 3; width: calc(100% + 32px); height: 33px; margin: 0 -16px; background: var(--sheet); border-radius: 30px 30px 0 0; }
.grab::before { content: ""; position: absolute; left: 50%; top: 10px; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--faint); opacity: .7; }
.sheet h2 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; padding: 0 6px; line-height: 1.15; }
.sheet .lead { color: var(--muted); font-size: 15px; padding: 6px 6px 18px; line-height: 1.4; }
.sheet .sect { padding: 10px 6px 8px; font-size: 13px; color: var(--muted); }
.group { background: var(--sheet-fill); border-radius: 20px; padding: 2px 16px; margin-bottom: 14px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 8px 0; font-size: 16px; }
.opt small { color: var(--muted); font-size: 14px; flex: none; }
.opt svg.i { width: 20px; height: 20px; stroke-width: 2.4; flex: none; }
.opt span small { display: block; font-size: 13px; margin-top: 2px; }
.group .field input, .sheet textarea { background: var(--sheet); }
.sheet textarea { width: 100%; min-height: 110px; background: var(--sheet-fill); border: 0; border-radius: 20px; padding: 14px 16px; outline: none; resize: none; margin-bottom: 14px; -webkit-user-select: text; user-select: text; line-height: 1.4; }
.busy { text-align: center; padding: 30px 0 40px; color: var(--muted); }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--accent); margin: 0 auto 16px; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.err { color: var(--danger); font-size: 15px; padding: 0 6px 14px; }

/* Hızlı kayıt */
.qbox { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 16px; background: var(--sheet-fill); color: var(--muted); }
.qbox input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg); -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
.qbox input::-webkit-search-cancel-button { display: none; }
.sheet .stepper { background: var(--sheet); }
/* Yazdıkça yüksekliği zıplamasın. */

/* Gıdalarım */
.fi { display: flex; align-items: center; gap: 12px; min-width: 0; }
/* Gıda ızgarası: seçim yapılan her yerde aynı kart (hızlı kayıt, kalem yerine, Gıdalarım). */
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.fcard { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 12px 6px 12px; border-radius: 18px; background: var(--sheet-fill); text-align: center; }
.fcard:active { transform: scale(.96); }
.fimg { position: relative; width: 64px; height: 64px; margin-bottom: 6px; display: grid; place-items: center; }
.fimg img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; }
.fimg i { width: 52px; height: 52px; border-radius: 50%; background: var(--sheet); color: var(--muted); display: grid; place-items: center; font: 600 22px/1 inherit; font-style: normal; }
.fimg img.fico { border-radius: 0; object-fit: contain; }
.fbadge { position: absolute; right: -4px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--sheet); }
.fbadge svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.fcard b { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.fcard small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.fcard small.fu { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard small.fv { white-space: nowrap; margin-top: 2px; color: var(--fg); opacity: .72; }
.opt > .fi { flex: none; }
.th { width: 40px; height: 40px; border-radius: 11px; flex: none; object-fit: cover; display: grid; place-items: center; background: var(--sheet); color: var(--muted); font-size: 15px; font-weight: 600; }
.th.fico { background: none; border-radius: 0; } .th.fico img { width: 40px; height: 40px; object-fit: contain; }
.trow { padding-bottom: 12px; }
.trow + .trow { box-shadow: inset 0 1px 0 var(--track); }
.trow .row { min-height: 48px; padding-bottom: 6px; }
.trow .th { width: 36px; height: 36px; border-radius: 10px; }
.qchips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.qchips button { height: 34px; border-radius: 10px; background: var(--sheet); font-size: 14px; font-weight: 600; text-align: center; color: var(--muted); }
.qchips button.on { background: var(--fg); color: var(--bg); }
.qchips button:active { transform: scale(.92); }
.qchips.free { margin: 0 2px 14px; }
.qchips.free button:not(.on) { background: var(--sheet-fill); }
.fphoto { display: flex; align-items: center; gap: 16px; padding: 4px 6px 18px; }
.fphoto p { font-size: 14px; color: var(--muted); line-height: 1.35; margin-bottom: 10px; }
.ph { width: 88px; height: 88px; border-radius: 22px; flex: none; background: var(--sheet-fill); color: var(--muted); display: grid; place-items: center; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph svg.i { width: 28px; height: 28px; }
.ph:active { transform: scale(.96); }
.pill svg.i { width: 16px; height: 16px; stroke-width: 2.4; margin: 0 4px 0 -4px; }
.pill:disabled { opacity: .5; }
.fl { display: flex; align-items: center; gap: 12px; min-height: 52px; font-size: 16px; }
.fl + .fl { box-shadow: inset 0 1px 0 var(--track); }
.fl span { width: 72px; flex: none; color: var(--muted); font-size: 15px; }
.fl input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: none; -webkit-user-select: text; user-select: text; }
.primary:disabled { opacity: .4; }
.fl span.wide { width: auto; flex: 1; color: var(--fg); font-size: 16px; }
/* Anahtar: açıkken zeminle aynı tek renk, vurgu rengi yok. */
.sw { width: 51px; height: 31px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background .2s; }
.sw i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / 22%); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.sw.on { background: var(--fg); } .sw.on i { transform: translateX(20px); background: var(--bg); }

/* Kalem sayfası */
.amtbox { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; align-items: center; gap: 8px; background: var(--sheet-fill); border-radius: 20px; padding: 8px; margin-bottom: 14px; }
.amtbox > button { height: 54px; border-radius: 16px; background: var(--sheet); display: grid; place-items: center; }
.amtbox > button:active { transform: scale(.94); }
.amtbox div { text-align: center; min-width: 0; }
.amtbox b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.amtbox small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.radio { width: 24px; height: 24px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--faint); display: grid; place-items: center; }
.radio.on { background: var(--fg); color: var(--bg); box-shadow: none; }
.radio svg.i { width: 14px; height: 14px; stroke-width: 3; }
.group .opt + .opt { box-shadow: inset 0 1px 0 var(--track); }
.shot { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 22px; margin-bottom: 14px; }
.pages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.pg { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--sheet-fill); }
.pg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pg i { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgb(0 0 0 / 55%); color: #fff; display: grid; place-items: center; }
.pg i svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.pg.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
.pg.add small { font-size: 12px; font-weight: 600; }
.pg .spin { width: 22px; height: 22px; margin: 0; }
.pg:active { transform: scale(.96); }
.sheet .group .nav-row + .nav-row { box-shadow: inset 0 1px 0 var(--track); }

/* İlerleme: uyum takvimi (sütun hafta, satır gün) */
.heat { display: flex; gap: 6px; margin-top: 16px; }
.hdays { display: grid; grid-template-rows: repeat(7, 13px); row-gap: 3px; padding-top: 19px; font-size: 10px; line-height: 13px; color: var(--muted); flex: none; }
.hscroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hmon { position: relative; height: 16px; margin-bottom: 3px; font-size: 10px; color: var(--muted); }
.hmon span { position: absolute; top: 0; white-space: nowrap; }
.hgrid { display: flex; gap: 3px; width: max-content; }
.hcol { display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; }
.hc { display: block; width: 13px; height: 13px; border-radius: 3.5px; background: var(--track); }
.hc.l1 { background: color-mix(in srgb, var(--fg) 22%, var(--track)); }
.hc.l2 { background: color-mix(in srgb, var(--fg) 45%, var(--track)); }
.hc.l3 { background: color-mix(in srgb, var(--fg) 70%, var(--track)); }
.hc.l4 { background: var(--fg); }
.hc.fut { background: transparent; }
.hc.now { box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--accent); }
.hleg { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--muted); }
.hleg span { display: flex; align-items: center; gap: 3px; }
.hleg span .hc { width: 11px; height: 11px; margin: 0 1px; }
.hleg button { font-size: 13px; color: var(--muted); }
.mrow { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1fr; align-items: center; min-height: 46px; font-size: 15px; }
.mrow b { font-weight: 600; }
.mrow span { text-align: right; color: var(--muted); }
.mrow.h { min-height: 30px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mrow:not(.h) + .mrow { box-shadow: inset 0 1px 0 var(--track); }
.wchart { width: 100%; height: 120px; display: block; margin: 14px 0 6px; }
.wchart polyline { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.wchart line { stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.wlab { font-size: 12px; color: var(--muted); padding-bottom: 4px; }

/* Haftalık rapor */
.report { background: var(--sheet-fill); border-radius: 20px; padding: 16px; margin-bottom: 14px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.report i { color: var(--muted); }
a.primary { text-decoration: none; }

/* Asistan */
.hright { display: flex; align-items: center; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px 16px; }
.chips button { min-height: 36px; padding: 7px 14px; border-radius: 999px; background: var(--sheet-fill); font-size: 14px; font-weight: 500; line-height: 1.3; }
.chips button:active { transform: scale(.96); }
.chips.pick { padding-bottom: 12px; }
.chips.pick button { color: var(--muted); font-weight: 600; }
.chips.pick button.on { background: var(--fg); color: var(--bg); }
/* Asistan sayfası: üstte yapışık çubuk (geçmiş · başlık · yeni), ortada sohbet, altta sabit yazı kutusu.
   Kullanıcının sorusu baloncuk; cevap balonsuz, sayfanın tam genişliğinde düz metin. */
body.on-chat main { padding-bottom: calc(env(safe-area-inset-bottom) + 172px); }
body.on-chat::after { height: calc(env(safe-area-inset-bottom) + 170px); }
.cbar { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 12px; margin: calc(-12px - env(safe-area-inset-top)) -16px 8px; padding: calc(env(safe-area-inset-top) + 8px) 16px 10px; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.cbar b { text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbar .round svg.i { width: 21px; height: 21px; }
.cempty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14vh 8px 0; }
.cico { width: 56px; height: 56px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); display: grid; place-items: center; margin-bottom: 16px; }
.cico svg.i { width: 26px; height: 26px; }
.cempty h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.cempty p { color: var(--muted); font-size: 15px; margin: 6px 0 24px; max-width: 30ch; }
.sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.sugg button { min-height: 64px; padding: 12px 14px; border-radius: 17px; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); font-size: 15px; line-height: 1.3; text-align: left; }
.sugg button:active { transform: scale(.97); }
.chat { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 0; }
.msg { font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.msg.u { align-self: flex-end; max-width: 84%; padding: 10px 15px; border-radius: 20px; border-bottom-right-radius: 6px; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); margin-top: 14px; }
.msg.a { align-self: stretch; padding: 4px 4px 0; }
.msg .li { display: block; position: relative; padding-left: 16px; }
.msg .li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.msg .cut { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
.mact { display: flex; gap: 4px; padding: 0 0 4px; }
.mact button { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.mact button svg.i { width: 17px; height: 17px; }
.mact button:active { background: var(--ctl); }
.prop { background: var(--card); border-radius: 22px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 16px 16px 12px; margin: 8px 0 12px; }
.prop .pt { font-size: 13px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
.prop .pr { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 6px 0; }
.prop .pr svg.i { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--muted); }
.prop .pr.bad { color: var(--muted); }
.prop .pw { font-size: 13px; font-weight: 600; line-height: 1.4; padding: 8px 0 0; }
.prop .pn { font-size: 13px; color: var(--muted); line-height: 1.4; padding: 6px 0 0; }
.prop .primary { margin-top: 14px; }
.prop .pst { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 8px 0 2px; }
.prop .pst svg.i { width: 16px; height: 16px; }
.cerr { padding: 12px 4px 0; }
/* Sohbet geçmişi: satıra dokununca açılır; sağdaki düğme ilk dokunuşta "Sil" olur, ikincide siler. */
.hrow { display: flex; align-items: center; gap: 8px; }
.group .hrow + .hrow { box-shadow: inset 0 1px 0 var(--track); }
.hrow .opt { flex: 1; min-width: 0; }
.hrow .opt > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow.on .opt > span { font-weight: 600; }
.hdel { flex: none; height: 32px; min-width: 32px; padding: 0 6px; margin-right: -8px; border-radius: 999px; display: grid; place-items: center; color: var(--faint); font-size: 14px; font-weight: 600; }
.hdel svg.i { width: 18px; height: 18px; }
.hdel.over { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); padding: 0 12px; }
.cbox .send:disabled { opacity: 1; background: var(--ctl); color: var(--faint); box-shadow: none; }
.typing { display: inline-flex; gap: 4px; padding: 8px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
/* Yazı kutusu alt çubuğun üstünde; yazarken alt çubuk gizlenir, kutu klavyenin üstüne iner. */
.cbox { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 6; max-width: 520px; margin: 0 auto; padding: 0 16px; display: flex; align-items: flex-end; gap: 8px; transition: bottom .2s; }
.cbox[hidden] { display: none; }
.cbox textarea { flex: 1; min-height: 50px; max-height: 140px; padding: 14px 18px; border: 0; border-radius: 25px; background: var(--card); box-shadow: var(--float), inset 0 0 0 1px var(--line); outline: none; resize: none; line-height: 1.35; -webkit-user-select: text; user-select: text; }
.cbox textarea::placeholder { color: var(--muted); }
.cbox .send { width: 50px; height: 50px; box-shadow: var(--float); }
body.typing .dock { opacity: 0; pointer-events: none; transform: translateY(20px); }
.dock { transition: opacity .2s, transform .2s; }
body.typing .cbox { bottom: calc(var(--kb, 0px) + 10px + env(safe-area-inset-bottom)); }
.send { width: 48px; height: 48px; border-radius: 50%; flex: none; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.send svg.i { stroke-width: 2.4; }
.send:disabled { opacity: .35; }
.send:active { transform: scale(.92); }

/* Döküm: yalnızca yazdırırken görünür; tema ne olursa olsun beyaz kâğıt. */
#print { display: none; }
@media print {
  @page { size: A4; margin: 14mm 12mm; }
  html, body { background: #fff !important; min-height: 0; }
  body::after { display: none; }
  body > :not(#print) { display: none !important; }
  #print { display: block; }
}
.pd { color: #111; font: 10pt/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pd header { padding-bottom: 10pt; border-bottom: 1.5pt solid #111; margin-bottom: 12pt; }
.pd h1 { font-size: 18pt; letter-spacing: -.01em; margin-bottom: 3pt; }
.pd header p { color: #555; font-size: 9.5pt; }
.pd table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 14pt; }
.pd th { text-align: left; font-weight: 600; color: #555; border-bottom: 1pt solid #bbb; padding: 4pt 6pt; }
.pd td { border-bottom: .5pt solid #e2e2e2; padding: 3.5pt 6pt; }
.pd th:not(:first-child), .pd td:not(:first-child) { text-align: right; }
.pd tr.un td { color: #999; }
.pd tr.un td:last-child { text-align: left; }
.pday { padding-top: 10pt; border-top: .75pt solid #ccc; margin-top: 4pt; }
.pday h2 { font-size: 12.5pt; display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; margin-bottom: 6pt; break-after: avoid; }
.pday h2 small, .pmeal h3 small { font-size: 9pt; font-weight: 500; color: #555; }
.pday.empty p { color: #999; font-size: 9.5pt; padding-bottom: 6pt; }
.pmeal { break-inside: avoid; padding: 3pt 0 5pt; }
.pmeal h3 { font-size: 10pt; font-weight: 700; display: flex; gap: 6pt; align-items: baseline; }
